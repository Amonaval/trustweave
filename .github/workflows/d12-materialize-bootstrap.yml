name: D12 Materialize Bootstrap

on:
  push:
    branches:
      - llm-push
    paths:
      - ".d12-transport/READY"
      - ".github/workflows/d12-materialize-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: d12-materialize-bootstrap
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout llm-push
        uses: actions/checkout@v4
        with:
          ref: llm-push
          fetch-depth: 0

      - name: Materialize checksum-verified D12 bootstrap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import json
          import re
          import shutil
          import tarfile
          import tempfile

          repo = Path.cwd()
          transport = repo / ".d12-transport"
          ready = transport / "READY"
          expected_names = [
              f"bootstrap.tar.xz.b64.part{i:02d}" for i in range(15)
          ]
          parts = [transport / name for name in expected_names]

          # Chunks are intentionally inert. Only READY may start materialization.
          if not ready.is_file():
              print("D12 transport is not marked READY; nothing to materialize.")
              raise SystemExit(0)

          actual_names = sorted(
              p.name for p in transport.glob("bootstrap.tar.xz.b64.part*")
          )
          if actual_names != expected_names:
              raise SystemExit(
                  f"D12 transport parts mismatch. expected={expected_names} actual={actual_names}"
              )
          for p in parts[:-1]:
              if p.stat().st_size != 12000:
                  raise SystemExit(f"Unexpected D12 transport chunk size: {p.name}={p.stat().st_size}")
          if parts[-1].stat().st_size != 3160:
              raise SystemExit(
                  f"Unexpected D12 final transport chunk size: {parts[-1].name}={parts[-1].stat().st_size}"
              )

          encoded = b"".join(p.read_bytes() for p in parts)
          if len(encoded) != 171160:
              raise SystemExit(f"Unexpected D12 encoded payload size: {len(encoded)}")
          if re.search(rb"\s", encoded):
              raise SystemExit("Whitespace is not allowed inside D12 base64 transport chunks.")

          archive_bytes = base64.b64decode(encoded, validate=True)
          expected_archive_sha = "4baf154f34402233e52050cfac2c6790e226cc77b5da814866705edf9f740486"
          actual_archive_sha = hashlib.sha256(archive_bytes).hexdigest()
          if actual_archive_sha != expected_archive_sha:
              raise SystemExit(
                  f"D12 transport SHA mismatch: expected {expected_archive_sha}, got {actual_archive_sha}"
              )

          with tempfile.TemporaryDirectory(prefix="d12-materialize-") as tmp:
              tmp_path = Path(tmp)
              archive = tmp_path / "baseline.tar.xz"
              archive.write_bytes(archive_bytes)

              extract = tmp_path / "extract"
              extract.mkdir()
              with tarfile.open(archive, "r:xz") as tf:
                  for member in tf.getmembers():
                      resolved = (extract / member.name).resolve()
                      if extract.resolve() not in resolved.parents and resolved != extract.resolve():
                          raise SystemExit(f"Unsafe archive path: {member.name}")
                      if member.issym() or member.islnk():
                          raise SystemExit(
                              f"Links are not allowed in D12 bootstrap archive: {member.name}"
                          )
                  tf.extractall(extract)

              source = extract / "d12-canonical-materialized"
              manifest_path = source / "manifest.json"
              if not manifest_path.is_file():
                  raise SystemExit("D12 manifest missing from transport archive.")

              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              if manifest.get("status") != "CANONICAL_CURRENT_STATE":
                  raise SystemExit(
                      f"Unexpected D12 manifest status: {manifest.get('status')}"
                  )
              if manifest.get("format") != "trustweave-d12-canonical-baseline-v1":
                  raise SystemExit(
                      f"Unexpected D12 manifest format: {manifest.get('format')}"
                  )

              files = manifest.get("all_files") or []
              direct_apply = manifest.get("direct_apply_order") or []
              owner_context = manifest.get("storage_owner_context_files") or []
              if len(files) != 95:
                  raise SystemExit(f"Expected 95 SQL files, found {len(files)}")
              if len(direct_apply) != 94:
                  raise SystemExit(
                      f"Expected 94 direct-apply files, found {len(direct_apply)}"
                  )
              if owner_context != ["71-storage-owner-context/000-storage-policies.sql"]:
                  raise SystemExit(
                      f"Unexpected Storage owner-context files: {owner_context}"
                  )

              listed_paths = set()
              for record in files:
                  rel = record["path"]
                  listed_paths.add(rel)
                  p = source / rel
                  if not p.is_file():
                      raise SystemExit(f"Manifest file missing: {rel}")
                  actual = hashlib.sha256(p.read_bytes()).hexdigest()
                  if actual != record["sha256"]:
                      raise SystemExit(f"Manifest hash mismatch: {rel}")
                  if p.suffix.lower() != ".sql":
                      raise SystemExit(f"Unexpected non-SQL payload: {rel}")

              actual_sql_paths = {
                  str(p.relative_to(source)).replace("\\", "/")
                  for p in source.rglob("*.sql")
              }
              if actual_sql_paths != listed_paths:
                  missing = sorted(listed_paths - actual_sql_paths)
                  extra = sorted(actual_sql_paths - listed_paths)
                  raise SystemExit(
                      f"Manifest/file mismatch. missing={missing} extra={extra}"
                  )

              # Defense in depth: bootstrap source must never embed deploy credentials.
              forbidden = [
                  re.compile(r"postgres(?:ql)?://", re.I),
                  re.compile(r"sb_secret_[A-Za-z0-9_-]+"),
                  re.compile(
                      r"eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}"
                  ),
              ]
              for rel in sorted(actual_sql_paths):
                  sql = (source / rel).read_text(encoding="utf-8", errors="strict")
                  for pattern in forbidden:
                      if pattern.search(sql):
                          raise SystemExit(
                              f"Forbidden credential-like content in {rel}: {pattern.pattern}"
                          )

              target = (
                  repo
                  / "generic-family-hierarchy-4"
                  / "supabase"
                  / "bootstrap"
                  / "releases"
                  / "2026-09-20-d12"
              )
              target.mkdir(parents=True, exist_ok=True)

              # Preserve only a hand-written README if one already exists.
              for child in list(target.iterdir()):
                  if child.name == "README.md":
                      continue
                  if child.is_dir():
                      shutil.rmtree(child)
                  else:
                      child.unlink()

              for child in source.iterdir():
                  dest = target / child.name
                  if child.is_dir():
                      shutil.copytree(child, dest)
                  else:
                      shutil.copy2(child, dest)

              apply_lines = [
                  "# TrustWeave D12 bootstrap apply order",
                  "# Generated from manifest.json. Do not reorder manually.",
                  "",
                  "# Direct PostgreSQL/Supabase database-context phase:",
                  *direct_apply,
                  "",
                  "# Hosted Supabase owner-context phase (apply via platform/dashboard tooling):",
                  *owner_context,
                  "",
              ]
              (target / "APPLY_ORDER.txt").write_text(
                  "\n".join(apply_lines), encoding="utf-8"
              )

              # Verify the committed staging tree after copy as well.
              copied_manifest = json.loads(
                  (target / "manifest.json").read_text(encoding="utf-8")
              )
              copied_sql = list(target.rglob("*.sql"))
              if len(copied_sql) != 95:
                  raise SystemExit(
                      f"Post-copy SQL count mismatch: expected 95, found {len(copied_sql)}"
                  )
              for record in copied_manifest["all_files"]:
                  p = target / record["path"]
                  actual = hashlib.sha256(p.read_bytes()).hexdigest()
                  if actual != record["sha256"]:
                      raise SystemExit(f"Post-copy hash mismatch: {record['path']}")

          # Transport is a one-time staging mechanism, never permanent bootstrap source.
          shutil.rmtree(transport)
          print("D12 bootstrap materialization verified: 95 SQL files + manifest.")

          PY

      - name: Commit readable bootstrap payload
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A --             generic-family-hierarchy-4/supabase/bootstrap/releases/2026-09-20-d12             .d12-transport

          if git diff --cached --quiet; then
            echo "No materialization changes to commit."
            exit 0
          fi

          # Do not run git diff --check on the generated SQL payload.
          # Historical captured function bodies intentionally preserve byte-exact
          # whitespace covered by manifest hashes.
          git commit -m "D12 materialize verified bootstrap SQL payload"
          git push origin HEAD:llm-push
